version: '3.9'
services:
  django:
    container_name: simple_lms
    build: .
    command: sh -c "python /code/wait_for_db.py && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./code:/code
    ports:
      - "8001:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    container_name: simple_db
    environment:
      POSTGRES_DB: simple_lms
      POSTGRES_USER: simple_user
      POSTGRES_PASSWORD: simple_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5532:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simple_user"]
      interval: 10s
      timeout: 5s
      retries: 5