<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Pro - {% block title %}Learn Without Limits{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #10B981;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e1b4b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end)); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; }
        .orb-1 { width: 400px; height: 400px; background: rgba(79, 70, 229, 0.3); top: -100px; left: -100px; }
        .orb-2 { width: 500px; height: 500px; background: rgba(139, 92, 246, 0.2); bottom: -150px; right: -100px; }
        
        /* Navbar */
        nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--card-border); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand { font-size: 1.5rem; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--accent); }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #fff; }
        .btn-primary { background: var(--primary); color: #fff !important; padding: 8px 20px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; transition: background 0.3s; text-decoration: none; display: inline-block; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { border: 1px solid var(--card-border); color: #fff; padding: 8px 20px; border-radius: 8px; font-weight: 600; text-decoration: none; transition: background 0.3s; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }
        
        /* Layout */
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 5%; }
        
        /* Components */
        .glass-panel { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 20px; padding: 2rem; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .alert-error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        @media (max-width: 768px) {
            .nav-links { display: none; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <nav>
        <a href="{% url 'home' %}" class="brand"><i class="fa-solid fa-graduation-cap"></i> LMS Pro</a>
        <div class="nav-links">
            <a href="{% url 'home' %}">Courses</a>
            {% if user.is_authenticated %}
                <a href="{% url 'my_courses' %}">My Learning</a>
                <span style="color: var(--accent); margin-left: 10px;">Hi, {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="btn-outline">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}" class="btn-primary">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
