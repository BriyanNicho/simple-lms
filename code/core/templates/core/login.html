{% extends 'core/base.html' %}
{% block title %}Login{% endblock %}

{% block extra_css %}
<style>
    .auth-container { max-width: 400px; margin: 2rem auto; }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
    .form-control { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.2); color: #fff; outline: none; transition: border-color 0.3s; }
    .form-control:focus { border-color: var(--accent); }
    .auth-title { text-align: center; margin-bottom: 2rem; font-size: 2rem; }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .btn-full { width: 100%; padding: 12px; font-size: 1.1rem; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container glass-panel">
    <h2 class="auth-title">Welcome Back</h2>
    
    <form action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Login</button>
    </form>
    
    <div class="auth-footer">
        Belum punya akun? <a href="{% url 'register' %}">Daftar sekarang</a>
    </div>
</div>
{% endblock %}
